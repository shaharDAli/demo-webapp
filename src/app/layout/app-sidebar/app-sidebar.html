<aside class="app-sidebar">
	<div class="app-sidebar__brand">
		<span class="app-sidebar__mark"></span>
		<span>DEMO VMS</span>
	</div>

	<div class="app-sidebar__label">Modules</div>

	<nav class="app-sidebar__nav">
		<a routerLink="/dashboard" routerLinkActive="is-active">
			<svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-dash"></use></svg>
			Dashboard
		</a>
		<a routerLink="/locations" routerLinkActive="is-active">
			<svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-pin"></use></svg>
			Locations
		</a>
		<a routerLink="/vending-machines" routerLinkActive="is-active">
			<svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-machine"></use></svg>
			Vending Machines
		</a>
		<a routerLink="/products" routerLinkActive="is-active">
			<svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-box"></use></svg>
			Products
		</a>
		<div class="app-sidebar__group">
			<a routerLink="/events" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
				<svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-event"></use></svg>
				Kafka Events
			</a>
			<div class="app-sidebar__subnav">
				<a routerLink="/events/logs" routerLinkActive="is-active" class="app-sidebar__sublink">
					<svg viewBox="0 0 24 24" width="14" height="14">
						<path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
					</svg>
					Kafka Logs
				</a>
			</div>
		</div>
	</nav>

	<div class="app-sidebar__footer">
		<svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-user"></use></svg>
		Back office · Admin
	</div>
</aside>
